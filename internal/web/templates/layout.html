{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .Title}}{{.Title}} · {{end}}{{.Site}}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="/">{{.Site}}</a>
      {{if .User}}
      <nav class="nav">
        <a href="/admin"{{if eq .Nav "monitors"}} class="active"{{end}}>Monitors</a>
        <a href="/admin/components"{{if eq .Nav "components"}} class="active"{{end}}>Components</a>
        <a href="/admin/incidents"{{if eq .Nav "incidents"}} class="active"{{end}}>Incidents</a>
        <a href="/admin/maintenance"{{if eq .Nav "maintenance"}} class="active"{{end}}>Maintenance</a>
        <a href="/admin/webhooks"{{if eq .Nav "webhooks"}} class="active"{{end}}>Webhooks</a>
      </nav>
      <div class="user-menu">
        <a href="/admin/account"{{if eq .Nav "account"}} class="active"{{end}}>{{.User.Username}}</a>
        <form method="post" action="/admin/logout" class="inline">
          <input type="hidden" name="csrf" value="{{.User.CSRFToken}}">
          <button type="submit" class="link">Log out</button>
        </form>
      </div>
      {{end}}
    </div>
  </header>
  <main class="container">
    {{with .Flash}}<div class="alert success" role="status">{{.}}</div>{{end}}
    {{template "content" .}}
  </main>
  <footer class="site-footer">
    <div class="inner muted small">
      <span>Updated {{datetime now}}</span>
      {{if not .User}}<a href="/admin/login">Admin</a>{{end}}
    </div>
  </footer>
</body>
</html>{{end}}
