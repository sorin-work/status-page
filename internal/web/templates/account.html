{{define "content"}}
<div class="page-head">
  <h1>Account</h1>
</div>
<p class="muted">Signed in as <strong>{{.User.Username}}</strong>.</p>
{{with .Data.Error}}<div class="alert">{{.}}</div>{{end}}
<form method="post" action="/admin/account/password" class="card stacked">
  <input type="hidden" name="csrf" value="{{.User.CSRFToken}}">
  <h2>Change password</h2>
  <div class="field">
    <label for="current_password">Current password</label>
    <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
  </div>
  <div class="field">
    <label for="new_password">New password</label>
    <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="8" required>
  </div>
  <div class="field">
    <label for="confirm_password">Repeat new password</label>
    <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required>
  </div>
  <button type="submit">Change password</button>
</form>
{{end}}
