{{define "content"}}
{{$f := .Data}}
<div class="page-head">
  <h1>New incident</h1>
</div>
<form method="post" action="/admin/incidents" class="stacked card">
  <input type="hidden" name="csrf" value="{{$.User.CSRFToken}}">
  <div class="field{{if index $f.Errors "title"}} invalid{{end}}">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{$f.Title}}" placeholder="Elevated error rates on checkout" required>
    {{with index $f.Errors "title"}}<div class="error">Title {{.}}</div>{{end}}
  </div>
  <div class="row">
    <div class="field">
      <label for="status">Status</label>
      <select id="status" name="status">
        {{range $f.Statuses}}<option value="{{.}}"{{if eq (print .) $f.Status}} selected{{end}}>{{.}}</option>{{end}}
      </select>
      {{with index $f.Errors "status"}}<div class="error">Status {{.}}</div>{{end}}
    </div>
    <div class="field">
      <label for="impact">Impact</label>
      <select id="impact" name="impact">
        {{range $f.Impacts}}<option value="{{.}}"{{if eq (print .) $f.Impact}} selected{{end}}>{{.}}</option>{{end}}
      </select>
      {{with index $f.Errors "impact"}}<div class="error">Impact {{.}}</div>{{end}}
    </div>
  </div>
  <div class="field">
    <label for="component_id">Affected component</label>
    <select id="component_id" name="component_id">
      <option value="0">None / whole service</option>
      {{range $f.Components}}<option value="{{.ID}}"{{if eq .ID $f.ComponentID}} selected{{end}}>{{.Name}}</option>{{end}}
    </select>
  </div>
  <div class="field{{if index $f.Errors "message"}} invalid{{end}}">
    <label for="message">First update</label>
    <textarea id="message" name="message" placeholder="What is happening and what are you doing about it?" required>{{$f.Message}}</textarea>
    {{with index $f.Errors "message"}}<div class="error">Message {{.}}</div>{{end}}
  </div>
  <div class="actions">
    <button type="submit">Open incident</button>
    <a class="button secondary" href="/admin/incidents">Cancel</a>
  </div>
</form>
{{end}}
